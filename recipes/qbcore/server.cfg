# QBCore server, deployed by Project Singularity
# Recipe: https://github.com/Sp3arHead/Project-Singularity-Recipes/tree/main/recipes/qbcore
#
# QBCore:   https://docs.qbcore.org
# Commands: https://aka.cfx.re/server-commands

# Project Singularity
# -------------------
# - The panel itself runs as the "monitor" resource and starts with the server;
#   do not ensure it here.
# - Admins sign in to the in-game menu (F10) with their Discord ID; the menu's
#   inventory and money tools use QBCore (Master Actions -> Framework).
# - The connection queue is part of the panel (Players -> Queue). This recipe
#   leaves out connectqueue so two queues do not fight over the slots.

# Network
# -------
{{serverEndpoints}}
sv_maxclients {{maxClients}}
set steam_webApiKey "none"

# Server
# ------
sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}} | QBCore"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "qbcore, qb-core, roleplay"
sets locale "root-AQ" # your language and region, e.g. en-US, de-DE
load_server_icon myLogo.png
sv_enforceGameBuild 3095 # The Chop Shop
set resources_useSystemChat true

# Database (oxmysql)
# ------------------
set mysql_connection_string "{{dbConnectionString}}"

# pma-voice
# ---------
setr voice_useNativeAudio true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1
setr voice_useSendingRangeOnly false

# QBCore
# ------
setr qb_locale "en"
setr UseTarget false

# Resources
# ---------
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

ensure qb-core
ensure [qb]
ensure [standalone]
ensure [voice]
ensure [defaultmaps]

# Administrators (ACE)
# --------------------
add_ace group.admin command allow # allow all commands
{{addPrincipalsMaster}}

add_ace resource.qb-core command allow # qb-core may run commands
add_ace qbcore.god command allow
add_principal qbcore.god group.admin
add_principal qbcore.god qbcore.admin
add_principal qbcore.admin qbcore.mod
