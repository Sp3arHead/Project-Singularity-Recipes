# ox_core server, deployed by Project Singularity
# Recipe: https://github.com/Sp3arHead/Project-Singularity-Recipes/tree/main/recipes/ox-core
#
# Overextended: https://overextended.dev/ox_core
# Commands:     https://aka.cfx.re/server-commands

# Project Singularity
# -------------------
# - The panel itself runs as the "monitor" resource and starts with the server;
#   do not ensure it here.
# - Admins sign in to the in-game menu (F10) with their Discord ID.
# - The connection queue is part of the panel (Players -> Queue).

# Network
# -------
{{serverEndpoints}}
sv_maxclients {{maxClients}}
set steam_webApiKey "none"

# Server
# ------
sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}} | ox_core"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "ox_core, overextended, roleplay"
sets locale "root-AQ" # your language and region, e.g. en-US, de-DE
load_server_icon oxpog.png
set resources_useSystemChat true

# https://docs.fivem.net/docs/server-manual/server-commands/#sv_enforcegamebuild-build
set sv_enforceGameBuild 3258
# https://docs.fivem.net/docs/server-manual/server-commands/#sv_filterrequestcontrol-mode
set sv_filterRequestControl -1

# Database (oxmysql)
# ------------------
set mysql_connection_string "{{dbConnectionString}}"

# Administrators (ACE)
# --------------------
add_ace group.admin command allow
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow
{{addPrincipalsMaster}}

# Ox
# --
setr ox:locale "en"
setr inventory:target true

# Resources
# ---------
ensure chat
ensure sessionmanager

start pe-basicloading
start bob74_ipl
start pma-voice
start oxmysql
start ox_lib
start ox_core
start ox_target
start illenium-appearance
start ox_inventory
start ox_banking
start ox_commands
start ox_doorlock
start ox_fuel
start npwd
