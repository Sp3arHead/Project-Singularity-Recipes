# Project Singularity recipe: Qbox (full)
# Built by scripts/build_recipes.py from the definitions there; edit those, not this file.
$engine: 3
$onesync: on
name: "Qbox (full)"
version: 1.0.0
author: Project Singularity
description: "Every Qbox resource with the ox stack, Renewed banking and weather, NPWD phone, appearance, voice and maps."

tasks:
