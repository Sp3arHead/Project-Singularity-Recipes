  - action: download_file
    url: https://raw.githubusercontent.com/Sp3arHead/Project-Singularity-Recipes/main/recipes/qbox-full/server.cfg
    path: ./server.cfg

  ## Cfx.re resources
  - action: download_file
    url: https://github.com/citizenfx/cfx-server-data/archive/refs/heads/master.zip
    path: ./tmp/cfx.zip
  - action: unzip
    src: ./tmp/cfx.zip
    dest: ./tmp/cfx
  - action: move_path
    src: ./tmp/cfx/cfx-server-data-master/resources/[managers]/mapmanager
    dest: ./resources/[cfx]/mapmanager
