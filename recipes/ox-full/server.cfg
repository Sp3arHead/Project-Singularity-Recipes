# ox_core (full), deployed by Project Singularity
# Recipe: https://github.com/Sp3arHead/Project-Singularity-Recipes/tree/main/recipes/ox-full
#
# Overextended: https://overextended.dev/ox_core
# Commands: https://aka.cfx.re/server-commands

# Project Singularity
# -------------------
# - The panel runs as the "monitor" resource and starts with the server;
#   do not ensure it here.
# - Admins open the in-game menu with F10 and sign in with their Discord ID.
# - The connection queue is part of the panel (Players -> Queue).

# Network
# -------
{{serverEndpoints}}
sv_maxclients {{maxClients}}
set steam_webApiKey "none"

# Server
# ------
sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}}"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets locale "root-AQ" # your language and region, e.g. en-US, de-DE
set resources_useSystemChat true
sets tags "ox_core, overextended, roleplay"
set sv_enforceGameBuild 3258
set sv_filterRequestControl -1

# Database (oxmysql)
# ------------------
set mysql_connection_string "{{dbConnectionString}}"

# Administrators (ACE)
# --------------------
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but not quit
{{addPrincipalsMaster}}

# ox_core
# -------
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

# pma-voice
# ---------
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_enableRadioAnim 1

# ox_lib
# ------
setr ox:locale "en"

# ox_inventory
# ------------
setr inventory:framework "ox" # ox_inventory talks to this framework
setr inventory:target true
setr inventory:imagepath "nui://ox_inventory/web/images"
set inventory:accounts ["money"]

# NPWD (phone)
set npwd:framework "ox"

# Resources
# ---------
ensure [cfx]
ensure chat
ensure oxmysql
ensure ox_lib
ensure ox_core
ensure ox_target
ensure ox_inventory
ensure [ox]
ensure [standalone]
