# QBCore (full), deployed by Project Singularity
# Recipe: https://github.com/Sp3arHead/Project-Singularity-Recipes/tree/main/recipes/qbcore-full
#
# QBCore: https://docs.qbcore.org
# Commands: https://aka.cfx.re/server-commands

# Project Singularity
# -------------------
# - The panel runs as the "monitor" resource and starts with the server;
#   do not ensure it here.
# - Admins open the in-game menu with F10 and sign in with their Discord ID.
# - The connection queue is part of the panel (Players -> Queue).
# - connectqueue is not installed: two queues would fight over the free slots.

# Network
# -------
{{serverEndpoints}}
sv_maxclients {{maxClients}}
set steam_webApiKey "none"

# Server
# ------
sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}}"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets locale "root-AQ" # your language and region, e.g. en-US, de-DE
set resources_useSystemChat true
sets tags "qbcore, qb-core, roleplay"
sv_enforceGameBuild 3095

# Database (oxmysql)
# ------------------
set mysql_connection_string "{{dbConnectionString}}"

# Administrators (ACE)
# --------------------
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but not quit
{{addPrincipalsMaster}}

# QBCore
# ------
setr qb_locale "en"
setr UseTarget false
add_ace resource.qb-core command allow # qb-core may run commands
add_ace qbcore.god command allow
add_principal qbcore.god group.admin
add_principal qbcore.god qbcore.admin
add_principal qbcore.admin qbcore.mod

# pma-voice
# ---------
setr voice_useNativeAudio true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1
setr voice_useSendingRangeOnly false

# Security
# --------
sv_enableNetworkedSounds false
sv_enableNetworkedScriptEntityStates false
sv_enableNetworkedPhoneExplosions false

# Resources
# ---------
ensure [cfx]
ensure chat
ensure sessionmanager
ensure hardcap
ensure oxmysql
ensure qb-core
ensure [qb]
ensure [standalone]
ensure [voice]
ensure [defaultmaps]
