# ESX Legacy server, deployed by Project Singularity
# Recipe: https://github.com/Sp3arHead/Project-Singularity-Recipes/tree/main/recipes/esx-legacy
#
# ESX:      https://esx-framework.org/ | https://discord.esx-framework.org/
# Commands: https://aka.cfx.re/server-commands

# Project Singularity
# -------------------
# - The panel itself runs as the "monitor" resource and starts with the server;
#   do not ensure it here.
# - Admins sign in to the in-game menu (F10) with their Discord ID; the menu's
#   inventory and money tools use ESX (Master Actions -> Framework).
# - The connection queue is part of the panel (Players -> Queue); no queue
#   resource is needed.

# Network
# -------
{{serverEndpoints}}
sv_maxclients {{maxClients}}

# Server
# ------
sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}} | ESX Legacy"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "esx, esx legacy, roleplay"
sets locale "root-AQ" # your language and region, e.g. en-US, de-DE
load_server_icon esxLogo.png
sv_enforceGameBuild 3258
set resources_useSystemChat true

# Database (oxmysql)
# ------------------
set mysql_connection_string "{{dbConnectionString}}"

# Administrators (ACE)
# --------------------
add_principal group.admin group.user
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but not quit
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow
{{addPrincipalsMaster}}

# pma-voice
# ---------
setr voice_enableRadioAnim 1
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true

# Security
# --------
sv_enableNetworkedSounds false
sv_enableNetworkedScriptEntityStates false
sv_enableNetworkedPhoneExplosions false
sv_filterRequestControl 2

# ESX
# ---
# ESX would take its language from a txAdmin setting that Project Singularity
# does not have, so it is set here.
setr esx:locale "en"
# setr esx:identifier "license"

# Resources
# ---------
ensure chat
ensure oxmysql
ensure esx_lib

ensure es_extended
ensure [core]

ensure [standalone]
ensure [esx_addons]
