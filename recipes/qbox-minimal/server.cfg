# Qbox (minimal), deployed by Project Singularity
# Recipe: https://github.com/Sp3arHead/Project-Singularity-Recipes/tree/main/recipes/qbox-minimal
#
# Qbox: https://docs.qbox.re/
# Commands: https://aka.cfx.re/server-commands

# Project Singularity
# -------------------
# - The panel runs as the "monitor" resource and starts with the server;
#   do not ensure it here.
# - Admins open the in-game menu with F10 and sign in with their Discord ID.
# - The connection queue is part of the panel (Players -> Queue).

# Network
# -------
{{serverEndpoints}}
sv_maxclients {{maxClients}}
set steam_webApiKey "none"

# Server
# ------
sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}}"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets locale "root-AQ" # your language and region, e.g. en-US, de-DE
set resources_useSystemChat true
sets tags "qbox, qbx"
set sv_enforceGameBuild 3258

# Database (oxmysql)
# ------------------
set mysql_connection_string "{{dbConnectionString}}"

# Administrators (ACE)
# --------------------
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but not quit
{{addPrincipalsMaster}}

# Qbox
# ----
setr qb_locale "en"
setr qbx:enableBridge "true" # qb-core bridge, so QBCore resources keep working
set qbx:enableQueue "false" # the panel's queue (Players -> Queue) handles this
set qbx:bucketLockdownMode "inactive"
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:acknowledge "true"
add_ace resource.qbx_core command allow
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow
add_ace group.admin admin allow
add_ace group.mod mod allow
add_ace group.support support allow
add_principal group.admin group.mod
add_principal group.mod group.support

# illenium-appearance
setr illenium-appearance:locale "en"

# ox_lib
# ------
setr ox:locale "en"

# ox_inventory
# ------------
setr inventory:framework "qbx" # ox_inventory talks to this framework
setr inventory:target true
setr inventory:imagepath "nui://ox_inventory/web/images"
set inventory:accounts ["money"]

# Resources
# ---------
ensure [cfx]
ensure chat
ensure oxmysql
ensure ox_lib
ensure qbx_core
ensure [ox]
ensure [qbx]
ensure [standalone]
