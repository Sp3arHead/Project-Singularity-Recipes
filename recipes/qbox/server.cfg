# Qbox server, deployed by Project Singularity
# Recipe: https://github.com/Sp3arHead/Project-Singularity-Recipes/tree/main/recipes/qbox
#
# Qbox:     https://docs.qbox.re/
# Commands: https://aka.cfx.re/server-commands

# Project Singularity
# -------------------
# - The panel itself runs as the "monitor" resource and starts with the server;
#   do not ensure it here.
# - Admins sign in to the in-game menu (F10) with their Discord ID.
# - The connection queue is part of the panel (Players -> Queue). qbx_core's
#   own queue is switched off below so two queues do not fight over the slots.

# Network
# -------
{{serverEndpoints}}
sv_maxclients {{maxClients}}
set steam_webApiKey "none"

# Server
# ------
sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}} | Qbox"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "qbox, qbx, roleplay"
sets locale "root-AQ" # your language and region, e.g. en-US, de-DE
load_server_icon myLogo.png
set sv_enforceGameBuild 3258

# Database (oxmysql)
# ------------------
set mysql_connection_string "{{dbConnectionString}}"

# Chat
# ----
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined the server"
set qbx_chat:quitMessage "^1%s left the server (%s)"

# Voice
# -----
exec voice.cfg

# Qbox
# ----
setr qb_locale "en"
setr qbx:enableBridge "true" # qb-core bridge, so QBCore resources keep working
set qbx:enableQueue "false" # the panel's queue (Players -> Queue) handles this
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink "discord.gg/qbox"
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "false"
setr qbx:enableGroupManagement "false"
setr qbx:motd "<p style='padding: 1rem; background-color: #141517; border: 1px solid #373a40; border-radius: 0.5rem; text-align: center;'><span style='color: rgb(200, 200, 40);'>Welcome to {{serverName}}!</span></p>"

# illenium-appearance
setr illenium-appearance:locale "en"

# Renewed-Weathersync
setr weather_disablecd true

# Ox resources
exec ox.cfg

# NPWD (phone)
set npwd:framework "qbx"
# https://projecterror.dev/docs/npwd/start/installation#setting-up-camera-functionality
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

# Loading screen
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#f1e542"
set loadscreen:shadowColor "#1a18077f"

# Resources
# ---------
ensure mapmanager
ensure chat
ensure spawnmanager
ensure baseevents

ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure [assets]

ensure [npwd-apps]
ensure qbx_npwd
ensure npwd

# Administrators (ACE)
# --------------------
{{addPrincipalsMaster}}
exec permissions.cfg

# Miscellaneous
# -------------
exec misc.cfg
