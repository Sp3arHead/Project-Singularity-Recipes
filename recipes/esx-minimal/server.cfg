# ESX Legacy (minimal), deployed by Project Singularity
# Recipe: https://github.com/Sp3arHead/Project-Singularity-Recipes/tree/main/recipes/esx-minimal
#
# ESX: https://esx-framework.org/
# Commands: https://aka.cfx.re/server-commands

# Project Singularity
# -------------------
# - The panel runs as the "monitor" resource and starts with the server;
#   do not ensure it here.
# - Admins open the in-game menu with F10 and sign in with their Discord ID.
# - The connection queue is part of the panel (Players -> Queue).

# Network
# -------
{{serverEndpoints}}
sv_maxclients {{maxClients}}
set steam_webApiKey "none"

# Server
# ------
sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}}"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets locale "root-AQ" # your language and region, e.g. en-US, de-DE
set resources_useSystemChat true
sets tags "esx, esx legacy"
sv_enforceGameBuild 3258

# Database (oxmysql)
# ------------------
set mysql_connection_string "{{dbConnectionString}}"

# Administrators (ACE)
# --------------------
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but not quit
{{addPrincipalsMaster}}

# ESX
# ---
# ESX would take its language from a txAdmin setting Project Singularity does
# not have, so it is set here.
setr esx:locale "en"
add_principal group.admin group.user
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow

# Resources
# ---------
ensure [cfx]
ensure chat
ensure oxmysql
ensure esx_lib
ensure es_extended
ensure [core]
